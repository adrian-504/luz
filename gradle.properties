# Build performance (8 GB RAM development machine: keep heaps modest)
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Never download JDKs silently; use the installed JDK 21 (see tooling/scripts/verify.sh)
org.gradle.java.installations.auto-download=false

kotlin.code.style=official

# Apple Kotlin/Native targets: auto (enabled when a full Xcode iOS SDK is present), true, or false.
iptv.appleTargets=auto
